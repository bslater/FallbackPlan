# Per-module line-coverage floors, read by `eng/coverage.py --floors`.
#
# WHAT THESE ARE FOR
#
# The global `--floor 50` catches a collapse: a project dropping out of the
# run, a suite silently not executing. It cannot catch one module regressing,
# because a healthy total absorbs it — `FallbackPlan.Recovery` could go to zero
# and the union would barely move. These floors catch that, by name.
#
# Each is pinned roughly two points below the module's measured figure, which
# is slack enough that ordinary refactoring does not trip it and tight enough
# that deleting a test suite does.
#
# RAISING ONE IS A DELIBERATE ACT
#
# Lowering a floor to make a build pass is the failure this file exists to
# prevent; if a module has genuinely and knowingly lost coverage — a feature
# removed, a platform dropped — say so in the commit that lowers it. Raising
# one after real work is welcome and needs no ceremony.
#
# These are NOT targets. A module sitting well above its floor is not being
# asked to climb; the number is a tripwire, not a goal, and treating it as a
# goal is how coverage figures start being gamed.
#
# THE SINGLE-OS FIGURE, READ OFF A MERGED RUN
#
# `Filesystem.Local` measures far lower on Linux alone than it really is,
# because its macOS and Windows halves are unreachable there by construction.
# Its floor used to be pinned to the Linux figure and left deliberately loose,
# with a note saying the honest number needed a merged run to read off.
#
# That run has now happened: the union of ubuntu, windows and macos put
# `Filesystem.Local` at 62.26% (50.44% on Linux), and its floor below is set
# from the merged figure, on the same roughly-two-points-below convention as
# everything else. The consequence is that a local Linux run can report it
# below its floor. That is expected and is not a regression — only CI's merged
# report can judge it.
#
# `Keystore` was the other such module: 89.40% merged, 24.88% on Linux alone.
# Its floor went with the project. The platform keystore was deleted with the
# service's passphrase mode when format 1 was withdrawn (ADR-0014 Amendment 1,
# ADR-0028 §9), and a floor naming an assembly the report no longer contains
# is one nothing can trip, which the merge step refuses.
# See `docs/review/2026-08-coverage-audit.md` §3.

