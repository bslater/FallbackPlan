name: CI

on:
  push:
    branches: ["**"]
  pull_request:

# The default GITHUB_TOKEN gets read-only access and nothing else. No job
# here writes to the repository, and a workflow that could is a workflow a
# compromised action could abuse (NFR-SUP-002).
permissions:
  contents: read

# A superseded push's run is cancelled rather than raced against.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: 1
  CI: true

# Actions are pinned to commit SHAs, not floating tags, because a moved tag
# is a supply-chain vector this project's own requirements take seriously.
# Each pin records the tag it was resolved from; bump deliberately.
jobs:
  build:
    name: Build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          global-json-file: global.json
      # Locked mode: the committed packages.lock.json files are the restore
      # (NFR-SUP-003). A dependency change that forgot to update them fails
      # here rather than silently resolving something new.
      - name: Restore
        run: dotnet restore FallbackPlan.slnx --locked-mode
      # The exclusion of external/ is retained defensively: Bodu arrives as
      # prebuilt packages today (ADR-0021), but the gate should keep meaning
      # "FallbackPlan's own code" if anything under external/ is ever built
      # again. Both path-separator forms are excluded so the gate means the
      # same thing on every runner in the matrix.
      - name: Build
        shell: bash
        run: |
          set -o pipefail
          dotnet build FallbackPlan.slnx -c Release --no-restore 2>&1 | tee build.log
          if grep -E ': (warning|error) ' build.log | grep -vE '[/\\]external[/\\]'; then
            echo "::error::FallbackPlan code produced warnings or errors"
            exit 1
          fi
      # Coverage is collected on every OS because a single platform cannot
      # reach the others' interop: the scanner's Linux, Darwin and Windows
      # paths are mutually unreachable, so a one-OS number understates the
      # codebase. The merge job below unions them.
      - name: Test
        run: dotnet test FallbackPlan.slnx -c Release --no-build --collect:"XPlat Code Coverage" --results-directory coverage
      - name: Upload coverage
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage-${{ matrix.os }}
          path: coverage/**/coverage.cobertura.xml
          if-no-files-found: error
      - name: Upload build log
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: build-log-${{ matrix.os }}
          path: build.log
          if-no-files-found: ignore

  # The honest coverage number is the union of the matrix, not any one run.
  # A line only reachable on Windows is not "uncovered" — it is uncovered
  # HERE — and reporting a single platform's figure understates every
  # assembly with per-OS interop in it.
  coverage:
    name: Coverage (matrix merged)
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Download every platform's coverage
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: coverage-*
          merge-multiple: true
          path: coverage
      # Two floors, answering two different questions, and CI wants both.
      #
      # The global one sits below today's weakest module on purpose: it is
      # there to catch a COLLAPSE — a project dropping out of the run, a suite
      # silently not executing — which a per-module table cannot, because a
      # table only checks the modules it already knows about.
      #
      # The per-module table catches one module regressing, which the global
      # floor cannot, because a healthy total absorbs it: Keystore could go to
      # zero and the union would barely move. It also fails on a floor naming
      # a module that no longer exists, and on a module with no floor — a new
      # assembly is otherwise unguarded from the moment it is created, which
      # is exactly when nobody notices it has no tests.
      - name: Merge and report
        shell: bash
        run: |
          set -o pipefail
          python3 eng/coverage.py --report-only coverage \
            --floor 50 --floors eng/coverage-floors.toml | tee coverage-summary.txt
          {
            echo '### Coverage (union of ubuntu, windows, macos)'
            echo '```'
            cat coverage-summary.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload merged summary
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage-summary
          path: coverage-summary.txt
          if-no-files-found: ignore

  dependencies:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          global-json-file: global.json
      - name: Restore
        run: dotnet restore FallbackPlan.slnx --locked-mode
      # NFR-SUP-002: CI fails on a known-vulnerable dependency. NuGetAudit
      # already escalates restore-time advisories via warnings-as-errors; this
      # step is the explicit, named gate so the protection does not rest on an
      # SDK default and its output is readable in one place.
      - name: No known-vulnerable packages
        shell: bash
        run: |
          dotnet list FallbackPlan.slnx package --vulnerable --include-transitive 2>&1 | tee vulnerable.log
          if grep -q "has the following vulnerable packages" vulnerable.log; then
            echo "::error::Known-vulnerable package in the dependency graph"
            exit 1
          fi

  # A GitHub "Download ZIP" is `git archive` output: no .git directory, no
  # submodules, nothing gitignored. Building from that shape proves the tree
  # is self-contained (ADR-0021) — the property that lets a laptop with no
  # git at all open FallbackPlan.slnx in Visual Studio and build.
  archive-build:
    name: Source archive is self-contained
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          global-json-file: global.json
      - name: Build and test from a git archive of the tree
        shell: bash
        run: |
          set -euo pipefail
          tmp=$(mktemp -d)
          git archive HEAD | tar -x -C "$tmp"
          cd "$tmp"
          dotnet restore FallbackPlan.slnx --locked-mode
          dotnet build FallbackPlan.slnx -c Release --no-restore
          dotnet test FallbackPlan.slnx -c Release --no-build

  # Every runner in the build matrix is an English, dot-decimal machine, so the
  # matrix proves nothing about the locale the software actually runs under.
  # `HostileCultureTests` covers the asymmetric case a whole-suite sweep cannot
  # — written under one culture, read under another — and this covers the
  # opposite blind spot: the code paths nobody thought to write a culture test
  # for. tr-TR is the harshest single choice, because its dotless `ı` breaks
  # ASCII case folding and its numbers use a comma decimal and a dot group
  # separator. DOTNET_CLI_UI_LANGUAGE keeps the log readable; it moves the UI
  # culture only, so the formatting culture under test stays Turkish.
  hostile-culture:
    name: Suite passes under a hostile locale
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          global-json-file: global.json
      - name: Restore
        run: dotnet restore FallbackPlan.slnx --locked-mode
      - name: Build
        run: dotnet build FallbackPlan.slnx -c Release --no-restore
      - name: Test under tr-TR
        env:
          LC_ALL: tr-TR.UTF-8
          LANG: tr-TR.UTF-8
          DOTNET_CLI_UI_LANGUAGE: en
        run: dotnet test FallbackPlan.slnx -c Release --no-build

  conformance-vectors:
    name: Conformance vectors are reproducible
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      # Vectors are committed. If regenerating produces different bytes, either
      # the generator changed without the vectors being refreshed, or the
      # generator is not deterministic. Both are defects.
      - name: Verify committed vectors match freshly computed ones
        run: python3 specifications/repository-format/conformance/generate.py --check

  documentation:
    name: Documentation integrity
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Links and anchors resolve
        run: python3 eng/check-links.py
      - name: Requirement IDs unique and fully traced
        run: python3 eng/check-requirements.py
      # A csproj on disk but absent from the .slnx is never built, never
      # tested, and never architecture-checked - silently.
      - name: Every project is in the solution
        run: python3 eng/check-solution.py
      # A decision record is never wrong after the fact - nothing in it goes
      # red when the thing it decided turns out to be half-built.
      - name: Implementation status cites code that exists
        run: python3 eng/check-adr-status.py
      # A generated accessor that has drifted from its resx compiles fine and
      # then throws the resource key at a user instead of the message.
      - name: Resource accessors match their resx
        run: python3 eng/generate-resources.py --check
