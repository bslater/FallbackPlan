name: CI

on:
  push:
    branches: ["**"]
  pull_request:

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: 1
  CI: true

jobs:
  build:
    name: Build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Restore
        run: dotnet restore FallbackPlan.slnx
      # Vendored code under external/ is built as a dependency and carries its own
      # analyzer configuration. Its warnings are not ours to fix and must not mask
      # ours, so the gate is scoped to FallbackPlan's own code.
      - name: Build
        shell: bash
        run: |
          set -o pipefail
          dotnet build FallbackPlan.slnx -c Release --no-restore 2>&1 | tee build.log
          # The path separator differs by runner, so both forms are excluded —
          # matching only '/external/' would let this gate fail on Windows for
          # vendored warnings it is meant to ignore.
          if grep -E ': (warning|error) ' build.log | grep -vE '[/\\]external[/\\]'; then
            echo "::error::FallbackPlan code produced warnings or errors"
            exit 1
          fi
      - name: Test
        run: dotnet test FallbackPlan.slnx -c Release --no-build

  conformance-vectors:
    name: Conformance vectors are reproducible
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Vectors are committed. If regenerating produces different bytes, either
      # the generator changed without the vectors being refreshed, or the
      # generator is not deterministic. Both are defects.
      - name: Verify committed vectors match freshly computed ones
        run: python3 specifications/repository-format/conformance/generate.py --check

  documentation:
    name: Documentation integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Links and anchors resolve
        run: python3 eng/check-links.py
      - name: Requirement IDs unique and fully traced
        run: python3 eng/check-requirements.py
